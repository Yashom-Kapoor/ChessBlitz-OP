<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChessBlitz Dev Console</title>
{% raw %}
<style>
  :root {
    --bg: #25262e;
    --card: #2B2D3B;
    --accent: #C7C7C7;
    --text: #efefef;
    --muted: #efefef99;
    --faint: #efefef60;
    --line: #efefef22;
    --light-square: #FFF37E;
    --dark-square: #454A64;
    --ok: #4ade80;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .3px; }
  header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
  .tag {
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    background: var(--accent); color: var(--card);
    padding: 3px 7px; border-radius: 6px;
  }
  main { padding: 20px; display: grid; gap: 20px; grid-template-columns: 1fr; max-width: 1180px; }
  @media (min-width: 940px) { main { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
  .card { background: var(--card); border-radius: 14px; padding: 18px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card p.sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  button {
    font: inherit; font-weight: 600; font-size: 14px;
    padding: 9px 14px; border-radius: 10px; border: 0;
    background: var(--accent); color: var(--card); cursor: pointer;
  }
  button.muted { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .4; cursor: default; }
  input {
    font: inherit; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #00000033; color: var(--text); min-width: 0;
  }
  input::placeholder { color: var(--faint); }
  .grow { flex: 1 1 120px; }
  .status { font-size: 13px; min-height: 20px; color: var(--muted); }
  .status.err { color: var(--bad); }
  .status.ok { color: var(--ok); }

  /* board */
  .board-wrap { display: grid; grid-template-columns: auto 1fr; gap: 4px; margin-bottom: 12px; }
  .ranks { display: grid; grid-template-rows: repeat(8, 1fr); }
  .ranks span, .files span {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--faint);
  }
  .files { display: grid; grid-template-columns: repeat(8, 1fr); height: 16px; grid-column: 2; }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    /* Explicit rows matter: without them a rank holding no pieces has no content to size
       against and collapses, squashing the board. */
    grid-template-rows: repeat(8, 1fr);
    aspect-ratio: 1; width: 100%; border-radius: 8px; overflow: hidden;
  }
  .sq {
    position: relative; display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; min-width: 0; min-height: 0;
  }
  .sq.light { background: var(--light-square); }
  .sq.dark  { background: var(--dark-square); }
  .sq.from, .sq.to { box-shadow: inset 0 0 0 3px #2f80ed; }
  .sq.sel { box-shadow: inset 0 0 0 3px #ffffffcc; }
  .sq .dot {
    position: absolute; width: 26%; height: 26%; border-radius: 50%;
    background: #00000055; pointer-events: none;
  }
  .sq.occupied .dot { width: 86%; height: 86%; background: transparent; border: 3px solid #00000055; }
  .pc { pointer-events: none; width: 88%; height: 88%; display: block; }

  dl.info { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 12px; font-size: 13px; }
  dl.info dt { color: var(--faint); }
  dl.info dd { margin: 0; word-break: break-word; }
  .moves { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .moves .mv {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    padding: 3px 7px; border-radius: 6px; background: #00000033; color: var(--muted);
    border: 1px solid transparent;
  }
  .moves .mv.player { background: #ffffff14; color: var(--text); }
  .moves .mv.done { opacity: .45; }
  .moves .mv.next { border-color: var(--accent); color: var(--text); }
  .fen { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }

  #auth { max-width: 360px; margin: 60px auto; }
  #auth .row { margin-bottom: 12px; }
  #auth input { width: 100%; }
  .hidden { display: none !important; }
</style>
{% endraw %}
</head>

<!-- Sign-in -->

      <button class="muted" id="next" title="Forward">&rsaquo;</button>
      <button class="muted" id="last" title="End">&raquo;</button>

{% raw %}
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.86.2/+esm';
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';

const cfg = window.__DEV_CONFIG__;
// detectSessionInUrl makes supabase-js inspect and rewrite the address bar looking for OAuth
// params. This page signs in with a password, so turn it off and leave the URL alone.
const sb = createClient(cfg.supabaseUrl, cfg.supabaseKey, {
  auth: { detectSessionInUrl: false },
});
const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------------------- helpers */

function setStatus(el, message, kind) {
  el.textContent = message || '';
  el.className = 'status' + (kind ? ' ' + kind : '');
}

/** Every call to the Flask API. Same origin, so the token is the only header that matters. */
async function api(path, init) {
  const { data } = await sb.auth.getSession();
  const token = data.session?.access_token;
  if (!token) { showAuth(); throw new Error('Not signed in'); }

  const res = await fetch(path, {
    ...init,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(init?.headers || {}) },
  });

  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { /* non-JSON error page */ }

  if (res.status === 401) { showAuth(); throw new Error(body?.error ?? 'Session expired — sign in again'); }
  if (res.status === 404 && !body?.error) throw new Error('404 — is the server running with DEV_TOOLS=1?');
  if (!res.ok) throw new Error(body?.error ?? (res.status + ': ' + text.slice(0, 200)));
  return body;
}

/** Runs an action with its button disabled, reporting to a status line. */
async function run(button, statusEl, label, fn) {
  const before = button?.disabled;
  if (button) button.disabled = true;
  setStatus(statusEl, label + '…');
  try {
    await fn();
  } catch (err) {
    setStatus(statusEl, err.message || String(err), 'err');
  } finally {
    if (button) button.disabled = before ?? false;
  }
}

/* ------------------------------------------------------------------- auth */

function showAuth() {
  const form = $('auth');
  // Once signed in the form is removed outright (see showConsole), so there is nothing left to
  // reveal — a reload is the clean way back to it.
  if (!form) { location.reload(); return; }
  form.classList.remove('hidden');
  $('console').classList.add('hidden');
  $('signout').classList.add('hidden');
  $('who').textContent = '';
}

async function showConsole(session) {
  // Removed, not hidden: Safari anchors the iCloud Passwords popover to the password input and
  // it survives `display: none`, leaving the overlay floating over the console. Dropping the
  // node — after blurring, so focus never sits on a detached element — dismisses it.
  const form = $('auth');
  if (form) {
    document.activeElement?.blur?.();
    form.remove();
  }
  $('console').classList.remove('hidden');
  $('signout').classList.remove('hidden');
  $('who').textContent = session.user.email ?? session.user.id;

  // Isolated: an account with no Shop row 404s here, and that must not stop the rest of the
  // console (the puzzle board in particular) from coming up. Either dev write creates the row.
  try {
    await loadShop();
  } catch (err) {
    $('shop-sub').textContent = 'Could not read the shop';
    setStatus($('shop-status'), err.message, 'err');
  }
}

$('auth-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  await run($('signin'), $('auth-status'), 'Signing in', async () => {
    const { data, error } = await sb.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value,
    });
    if (error) throw error;
    $('password').value = '';
    await showConsole(data.session);
  });
});

$('signout').addEventListener('click', async () => {
  await sb.auth.signOut();
  // Reload rather than re-render: the sign-in form is gone from the DOM, and this also clears
  // any puzzle or shop state belonging to the account being signed out of.
  location.reload();
});

/* ------------------------------------------------------------- shop panel */

async function loadShop() {
  const [shop, prices] = await Promise.all([api('/shop/me'), api('/shop/prices')]);
  const items = Object.keys(prices || {});
  const unlocked = items.filter((name) => shop?.[name]).length;
  $('shop-sub').textContent =
    'Balance: ' + (shop?.currency ?? '?') + ' · ' + unlocked + '/' + items.length + ' items unlocked';
}

const shopAction = (button, label, fn) =>
  run(button, $('shop-status'), label, async () => {
    const result = await fn();
    await loadShop();
    setStatus($('shop-status'), label + ' — done' + (result ? ' (' + result + ')' : ''), 'ok');
  });

$('set').addEventListener('click', () => {
  const value = Number($('amount').value.trim());
  if ($('amount').value.trim() === '' || !Number.isFinite(value)) {
    return setStatus($('shop-status'), 'Enter a number first', 'err');
  }
  shopAction($('set'), 'Set currency to ' + value, async () => {
    const body = await api('/dev/currency', { method: 'POST', body: JSON.stringify({ set: value }) });
    $('amount').value = '';
    return 'now ' + body.currency;
  });
});

const addCurrency = (button, delta) =>
  shopAction(button, 'Add ' + delta.toLocaleString(), async () => {
    const body = await api('/dev/currency', { method: 'POST', body: JSON.stringify({ add: delta }) });
    return 'now ' + body.currency;
  });

$('add1k').addEventListener('click', () => addCurrency($('add1k'), 1000));
$('add10k').addEventListener('click', () => addCurrency($('add10k'), 10000));

const setItems = (button, unlocked, label) =>
  shopAction(button, label, async () => {
    const body = await api('/dev/items', { method: 'PUT', body: JSON.stringify({ unlocked }) });
    return (body.items?.length ?? 0) + ' items';
  });

$('unlock').addEventListener('click', () => setItems($('unlock'), true, 'Unlock all items'));
$('relock').addEventListener('click', () => setItems($('relock'), false, 'Re-lock all items'));
$('refresh').addEventListener('click', () =>
  run($('refresh'), $('shop-status'), 'Refreshing', async () => {
    await loadShop();
    setStatus($('shop-status'), '');
  }));

/* ----------------------------------------------------------- puzzle panel */

const FILES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

/** chess.js gives {type:'k', color:'w'}; sprite ids follow the app's filenames, e.g. "wK". */
const pieceHref = (piece) => '#pc-' + piece.color + piece.type.toUpperCase();

/** `moves[0]` is the opponent's setup move; the player answers on odd indices. */
const splitMoves = (moves) => (moves || '').trim().split(/\s+/).filter(Boolean);
const toMove = (uci) => ({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci.slice(4) || undefined });

const state = {
  puzzle: null,   // { puzzleid, fen, moves, rating, themes }
  moves: [],      // UCI strings
  ply: 0,         // how many of them are applied
  chess: null,
  flipped: false,
  selected: null, // square the user has picked up
  legal: [],      // legal destinations for `selected`
};

/** Rebuild the position from the puzzle FEN by replaying `ply` moves. */
function rebuild() {
  const game = new Chess(state.puzzle.fen);
  for (let i = 0; i < state.ply; i++) game.move(toMove(state.moves[i]));
  state.chess = game;
  state.selected = null;
  state.legal = [];
}

function renderCoords() {
  const ranks = state.flipped ? [1, 2, 3, 4, 5, 6, 7, 8] : [8, 7, 6, 5, 4, 3, 2, 1];
  const files = state.flipped ? [...FILES].reverse() : FILES;
  $('ranks').innerHTML = ranks.map((r) => '<span>' + r + '</span>').join('');
  $('files').innerHTML = files.map((f) => '<span>' + f + '</span>').join('');
}

function renderBoard() {
  const board = $('board');
  if (!state.chess) { board.innerHTML = ''; return; }

  const grid = state.chess.board();              // rank 8 -> 1, file a -> h
  const rows = state.flipped ? [...grid].reverse() : grid;
  const lastUci = state.ply > 0 ? state.moves[state.ply - 1] : null;
  const last = lastUci ? { from: lastUci.slice(0, 2), to: lastUci.slice(2, 4) } : null;

  const cells = [];
  rows.forEach((row, r) => {
    const cols = state.flipped ? [...row].reverse() : row;
    cols.forEach((piece, c) => {
      const rank = state.flipped ? r + 1 : 8 - r;
      const file = state.flipped ? FILES[7 - c] : FILES[c];
      const square = file + rank;

      const classes = ['sq', (r + c) % 2 === 0 ? 'light' : 'dark'];
      if (last && square === last.from) classes.push('from');
      if (last && square === last.to) classes.push('to');
      if (state.selected === square) classes.push('sel');
      if (piece) classes.push('occupied');

      const dot = state.legal.includes(square) ? '<i class="dot"></i>' : '';
      const art = piece
        ? '<svg class="pc" viewBox="0 0 189 189"><use href="' + pieceHref(piece) + '"></use></svg>'
        : '';
      cells.push('<div class="' + classes.join(' ') + '" data-sq="' + square + '">' + art + dot + '</div>');
    });
  });
  board.innerHTML = cells.join('');
}

function renderInfo() {
  const p = state.puzzle;
  $('i-id').textContent = p?.puzzleid ?? '—';
  $('i-rating').textContent = p?.rating ?? '—';
  const themes = Array.isArray(p?.themes) ? p.themes.join(', ') : (p?.themes ?? '—');
  $('i-themes').textContent = themes === '' || themes == null ? '—' : themes;
  $('i-turn').textContent = state.chess ? (state.chess.turn() === 'w' ? 'white' : 'black') : '—';
  $('i-ply').textContent = state.puzzle ? state.ply + ' / ' + state.moves.length : '—';
  $('fen').value = state.chess ? state.chess.fen() : '';

  $('movelist').innerHTML = state.moves
    .map((uci, i) => {
      const classes = ['mv'];
      if (i % 2 === 1) classes.push('player');   // odd indices are the player's answers
      if (i < state.ply) classes.push('done');
      if (i === state.ply) classes.push('next');
      return '<span class="' + classes.join(' ') + '">' + uci + '</span>';
    })
    .join('');
}

function render() {
  renderCoords();
  renderBoard();
  renderInfo();
}

function goTo(ply) {
  if (!state.puzzle) return;
  state.ply = Math.max(0, Math.min(state.moves.length, ply));
  rebuild();
  render();
}

function setPuzzle(puzzle) {
  if (!puzzle?.fen) throw new Error('Response had no FEN — check the backend returns lowercase keys');
  state.puzzle = puzzle;
  state.moves = splitMoves(puzzle.moves);
  state.ply = 0;
  rebuild();
  render();
  setStatus($('puzzle-status'), 'Loaded ' + puzzle.puzzleid, 'ok');
}

$('load').addEventListener('click', () => {
  const id = $('pid').value.trim();
  if (!/^[A-Za-z0-9]{5}$/.test(id)) {
    return setStatus($('puzzle-status'), '"' + id + '" is not a 5-character puzzle id', 'err');
  }
  run($('load'), $('puzzle-status'), 'Loading ' + id, async () => {
    setPuzzle(await api('/puzzles/' + encodeURIComponent(id) + '/'));
  });
});

$('pid').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('load').click(); });

$('random').addEventListener('click', () =>
  run($('random'), $('puzzle-status'), 'Loading a random puzzle', async () => {
    const puzzle = await api('/puzzles/random/');
    $('pid').value = puzzle.puzzleid ?? '';
    setPuzzle(puzzle);
  }));

$('first').addEventListener('click', () => goTo(0));
$('prev').addEventListener('click', () => goTo(state.ply - 1));
$('next').addEventListener('click', () => goTo(state.ply + 1));
$('last').addEventListener('click', () => goTo(state.moves.length));
$('flip').addEventListener('click', () => { state.flipped = !state.flipped; render(); });

$('hint').addEventListener('click', () => {
  if (!state.puzzle) return setStatus($('puzzle-status'), 'Load a puzzle first', 'err');
  if (state.ply >= state.moves.length) return setStatus($('puzzle-status'), 'No move left to hint', 'err');
  // The endpoint is 1-indexed: move_number N replays moves[:N-1] and describes moves[N-1].
  run($('hint'), $('puzzle-status'), 'Asking for a hint', async () => {
    const body = await api('/puzzles/' + encodeURIComponent(state.puzzle.puzzleid) + '/hints/' + (state.ply + 1));
    setStatus($('puzzle-status'), body.hint ?? 'No hint returned');
  });
});

/* click-to-move: legality from chess.js, then checked against the solution */
$('board').addEventListener('click', (e) => {
  const cell = e.target.closest('.sq');
  if (!cell || !state.chess) return;
  const square = cell.dataset.sq;

  if (state.selected && state.legal.includes(square)) {
    attemptMove(state.selected, square);
    return;
  }

  const piece = state.chess.get(square);
  if (piece && piece.color === state.chess.turn()) {
    state.selected = square;
    state.legal = state.chess.moves({ square, verbose: true }).map((m) => m.to);
  } else {
    state.selected = null;
    state.legal = [];
  }
  renderBoard();
});

function attemptMove(from, to) {
  const options = state.chess.moves({ square: from, verbose: true }).filter((m) => m.to === to);
  if (!options.length) return;

  let promotion;
  if (options.some((m) => m.promotion)) {
    const answer = (prompt('Promote to? q, r, b or n', 'q') || '').trim().toLowerCase();
    if (!['q', 'r', 'b', 'n'].includes(answer)) {
      setStatus($('puzzle-status'), 'Promotion cancelled');
      state.selected = null; state.legal = []; renderBoard();
      return;
    }
    promotion = answer;
  }

  const played = from + to + (promotion || '');
  const expected = state.moves[state.ply];

  state.selected = null;
  state.legal = [];

  if (!expected) {
    setStatus($('puzzle-status'), 'Solution is already complete', 'err');
    renderBoard();
    return;
  }

  // A legal-but-wrong move is rejected rather than played, so the board stays in step with
  // the solution. Use the arrows to explore instead.
  if (played !== expected) {
    setStatus($('puzzle-status'), '✗ ' + played + ' — expected ' + expected, 'err');
    renderBoard();
    return;
  }

  goTo(state.ply + 1);
  setStatus($('puzzle-status'), '✓ ' + played, 'ok');
}

/* ------------------------------------------------------------------- boot */

try {
  const { data: initial } = await sb.auth.getSession();
  if (initial.session) { await showConsole(initial.session); } else { showAuth(); }
} catch {
  showAuth();
}
render();
</script>

</body>
</html>
